# Build the HIWIN RA6 image and push it to GitHub Container Registry.
#
# Triggers: every push to main (i.e. a merged PR) and manual "Run workflow".
# Result:   ghcr.io/<owner>/hiwin_ros2:humble            (moving tag, what run.py pulls)
#           ghcr.io/<owner>/hiwin_ros2:humble-<short sha> (immutable, for rollback)
#
# The package is private by default the first time it is created. To let
# `docker pull` work without a login: GitHub -> Packages -> hiwin_ros2 ->
# Package settings -> Change visibility -> Public.
name: Docker image

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: docker-image-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  ROS_DISTRO: humble

jobs:
  build:
    runs-on: ubuntu-latest
    # ROS 2 + MoveIt + EtherLab from source: ~20 min locally, slower on a 2-core runner.
    timeout-minutes: 120
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      # The runner image ships ~30 GB of toolchains we do not need; the ROS build
      # layers are several GB, so reclaim the space up front.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force
          df -h /

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ env.ROS_DISTRO }}
            type=sha,prefix=${{ env.ROS_DISTRO }}-

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          build-args: ROS_DISTRO=${{ env.ROS_DISTRO }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
