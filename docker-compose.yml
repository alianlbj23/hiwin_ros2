# Usage:
#   cp .env.example .env && edit ROBOT_IP
#   xhost +local:root                 # allow RViz to use the host X server
#   docker compose up robot           # real RA610-1476 via GC2 cabinet
#   docker compose up sim             # mock hardware
#   docker compose up -d desktop      # remote desktop: VNC / browser / SSH (set VNC_PASSWORD)
#
x-common: &common
  # Pulled from GHCR (built by .github/workflows/docker-image.yml). Set HIWIN_IMAGE
  # to use another tag or a locally built image; `docker compose build` still works.
  image: ${HIWIN_IMAGE:-ghcr.io/alianlbj23/hiwin_ros2:humble}
  build:
    context: .
  network_mode: host          # DDS discovery + TCP to the robot controller
  ipc: host
  stdin_open: true
  tty: true
  cap_add:
    - SYS_NICE                # let ros2_control_node raise its scheduling priority
  ulimits:
    rtprio: 99
    memlock: -1
  environment:
    DISPLAY: ${DISPLAY}
    QT_X11_NO_MITSHM: "1"
    ROS_DOMAIN_ID: ${ROS_DOMAIN_ID:-0}
    RA_TYPE: ${RA_TYPE:-ra610_1476}
    LAUNCH_RVIZ: ${LAUNCH_RVIZ:-true}
  volumes:
    - /tmp/.X11-unix:/tmp/.X11-unix:rw
    - /dev/shm:/dev/shm

services:
  # Real robot through the GC2 cabinet (TCP, needs ROBOT_IP).
  robot:
    <<: *common
    container_name: hiwin_ra6_robot
    environment:
      DISPLAY: ${DISPLAY}
      QT_X11_NO_MITSHM: "1"
      ROS_DOMAIN_ID: ${ROS_DOMAIN_ID:-0}
      RA_TYPE: ${RA_TYPE:-ra610_1476}
      LAUNCH_RVIZ: ${LAUNCH_RVIZ:-true}
      # run.py guarantees a value; with plain compose set ROBOT_IP in .env.
      ROBOT_IP: ${ROBOT_IP:-}
      CABINET: gc2
      USE_FAKE_HARDWARE: "false"

  # Mock hardware: safe to run anywhere, no robot required.
  sim:
    <<: *common
    container_name: hiwin_ra6_sim
    environment:
      DISPLAY: ${DISPLAY}
      QT_X11_NO_MITSHM: "1"
      ROS_DOMAIN_ID: ${ROS_DOMAIN_ID:-0}
      RA_TYPE: ${RA_TYPE:-ra610_1476}
      LAUNCH_RVIZ: ${LAUNCH_RVIZ:-true}
      USE_FAKE_HARDWARE: "true"

  # Your own code: user_ws/ is mounted at /user_ws and built as an overlay
  # workspace. Driven by ./dev.py. Talks to the sim/robot container over ROS 2
  # (host network); /ros2_ws and the MoveIt configuration are not touched.
  dev:
    <<: *common
    container_name: hiwin_ra6_dev
    working_dir: /user_ws
    command: ["bash", "--rcfile", "/user_ws/.devrc"]
    environment:
      DISPLAY: ${DISPLAY}
      QT_X11_NO_MITSHM: "1"
      ROS_DOMAIN_ID: ${ROS_DOMAIN_ID:-0}
    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      - /dev/shm:/dev/shm
      - ./user_ws:/user_ws

  # Interactive shell with the workspace sourced.
  shell:
    <<: *common
    container_name: hiwin_ra6_shell
    command: bash
    # For cabinet:=ecat (EtherCAT drives + cabinet IO) uncomment and make sure
    # the IgH EtherCAT master kernel module is loaded on the host:
    # privileged: true
    # devices:
    #   - /dev/EtherCAT0:/dev/EtherCAT0
    #   - /dev/i2c-0:/dev/i2c-0
    #   - /dev/ttyS1:/dev/ttyS1

  # Remote desktop (image target `desktop`): XFCE over VNC, the same desktop in a
  # browser through noVNC, and SSH, all as user `ros` with VNC_PASSWORD from .env.
  # The container refuses to start without a password. Host network: the ports
  # are opened on every interface of this PC. Driven by ./run.py -> 9.
  #   VNC viewer  <host>:5901
  #   browser     http://<host>:8080/vnc.html
  #   ssh         ssh -p 2222 ros@<host>
  desktop:
    <<: *common
    image: ${HIWIN_DESKTOP_IMAGE:-ghcr.io/alianlbj23/hiwin_ros2:humble-desktop}
    build:
      context: .
      target: desktop
    container_name: hiwin_ra6_desktop
    init: true                # forward docker stop to the entrypoint, reap zombies
    environment:
      ROS_DOMAIN_ID: ${ROS_DOMAIN_ID:-0}
      RA_TYPE: ${RA_TYPE:-ra610_1476}
      LAUNCH_RVIZ: ${LAUNCH_RVIZ:-true}
      ROBOT_IP: ${ROBOT_IP:-}
      # No `:?` guard: compose would then refuse to start every other service too.
      VNC_PASSWORD: ${VNC_PASSWORD:-}
      VNC_PORT: ${VNC_PORT:-5901}
      NOVNC_PORT: ${NOVNC_PORT:-8080}
      SSH_PORT: ${SSH_PORT:-2222}
      # X display inside the container. With the host network the X socket name is
      # shared with the host, so stay clear of the host's :0/:1.
      VNC_DISPLAY: ${VNC_DISPLAY:-20}
      VNC_GEOMETRY: ${VNC_GEOMETRY:-1920x1080}
    volumes:
      - /dev/shm:/dev/shm
      - ./user_ws:/user_ws
      - desktop_ssh_keys:/etc/ssh/keys   # keep the SSH host key across restarts

volumes:
  desktop_ssh_keys:
